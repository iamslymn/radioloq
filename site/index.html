<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F8FE" />
    <script>
      /* Theme before first paint: the visitor's own choice, else light. See src/lib/theme.ts. */
      (function () {
        var t = null
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = 'light'
        document.documentElement.setAttribute('data-theme', t)
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0E1929')
      })()
    </script>
    <meta name="robots" content="noindex, nofollow" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://region1.google-analytics.com https://formspree.io; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://formspree.io https://www.google-analytics.com https://region1.google-analytics.com https://analytics.google.com;"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Radioloq. Almaniya standartında ikinci baxış, öz dilinizdə.</title>
    <meta
      name="description"
      content="Almaniyada lisenziyalı həkim tərəfindən MRT və KT görüntülərinizə ikinci baxış. 48 saat ərzində öz dilinizdə aydın izah."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
